server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true   # 强制请求/响应都用 UTF-8，避免流式中文乱码

spring:
  application:
    name: yu_ai
  main:
    # 学习项目兜底：IDE 与 Maven 双 classpath 时可能扫到同名 @Bean，开启覆盖避免启动失败
    allow-bean-definition-overriding: true
  ai:
    # ===== Spring AI Alibaba · DashScope =====
    # 安全提醒：不要把真实 key 提交到 git，推荐用环境变量 DASHSCOPE_API_KEY 注入
    # 申请地址：https://dashscope.console.aliyun.com/apiKey
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:sk-请替换为你自己的key}
      # ----- Chat 模型 -----
      # 可选：qwen-max（最强）/ qwen-plus（推荐均衡）/ qwen-turbo（最便宜）/ qwen-long（超长上下文）
      # 多模态见 module09 · MultimodalController
      chat:
        options:
          model: qwen-plus
          temperature: 0.7
      # ----- Embedding 模型（RAG 用）-----
      # text-embedding-v3 是 DashScope 当前最新通用 embedding 模型
      embedding:
        options:
          model: text-embedding-v3
    # ===== 向量库：用最简单的内存版 SimpleVectorStore，适合学习 =====
    vectorstore:
      type: simple

logging:
  level:
    # 打开后能看到 Spring AI 拼给模型的完整 messages，强烈建议学习时打开
    org.springframework.ai: INFO
    qieyu.yu_ai: DEBUG
