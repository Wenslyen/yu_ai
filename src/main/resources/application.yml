server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true   # 强制请求/响应都用 UTF-8，避免流式中文乱码

spring:
  application:
    name: yu_ai
  main:
    # 学习项目兜底：IDE 与 Maven 双 classpath 时可能扫到同名 @Bean，开启覆盖避免启动失败
    allow-bean-definition-overriding: true
  ai:
    # ===== Chat 模型：使用 DeepSeek（OpenAI 兼容协议） =====
    # 安全提醒：不要把真实 key 提交到 git，推荐用环境变量 DEEPSEEK_API_KEY 注入
    openai:
      api-key: ${DEEPSEEK_API_KEY:sk-请替换为你自己的key}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
      # DeepSeek 不提供 embedding，关闭 OpenAI 自动配置的 embedding，让本地 transformers 生效
      embedding:
        enabled: false
    # ===== Embedding 模型：本地 Transformers（ONNX, sentence-transformers） =====
    # 启动时会下载 ~100MB 模型到本地缓存（首次较慢，之后离线可用）
    transformers:
      embedding:
        cache:
          directory: ${user.home}/.cache/spring-ai-transformers
    # ===== 向量库：用最简单的内存版 SimpleVectorStore，适合学习 =====
    vectorstore:
      type: simple

logging:
  level:
    # 打开后能看到 Spring AI 拼给模型的完整 messages，强烈建议学习时打开
    org.springframework.ai: INFO
    qieyu.yu_ai: DEBUG
