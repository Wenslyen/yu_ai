<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>yu_ai · 流式聊天</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
            background: #f5f6f8;
            color: #222;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header .title { font-weight: 600; }
        header .subtitle { color: #888; font-size: 12px; margin-left: 10px; }
        header a { color: #2563eb; text-decoration: none; font-size: 13px; }
        main {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .messages { max-width: 820px; margin: 0 auto; }
        .msg { margin: 14px 0; display: flex; align-items: flex-start; gap: 10px; }
        .msg.user { flex-direction: row-reverse; }
        .avatar {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 600; flex-shrink: 0;
            color: white;
        }
        .msg.user .avatar { background: #2563eb; }
        .msg.ai .avatar { background: #10b981; }
        .bubble {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: 14px;
            line-height: 1.6;
            font-size: 14px;
            word-break: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .msg.user .bubble {
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 4px;
            white-space: pre-wrap;
        }
        .msg.ai .bubble {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-bottom-left-radius: 4px;
        }
        .bubble p:first-child { margin-top: 0; }
        .bubble p:last-child { margin-bottom: 0; }
        .bubble pre {
            background: #1e1e1e; color: #e5e7eb;
            padding: 10px 12px; border-radius: 6px;
            overflow-x: auto; font-size: 13px;
            margin: 8px 0;
        }
        .bubble code { font-family: ui-monospace, Menlo, Consolas, monospace; }
        .bubble :not(pre) > code {
            background: #f1f5f9; color: #be185d;
            padding: 1px 5px; border-radius: 3px; font-size: 13px;
        }
        .bubble ul, .bubble ol { padding-left: 22px; margin: 6px 0; }
        .cursor {
            display: inline-block; width: 7px; height: 14px;
            background: #6b7280; vertical-align: -2px; margin-left: 2px;
            animation: blink 1s steps(1) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
        footer {
            background: #fff;
            border-top: 1px solid #e5e7eb;
            padding: 14px 20px;
        }
        .input-wrap {
            max-width: 820px; margin: 0 auto;
            display: flex; gap: 10px; align-items: flex-end;
        }
        #input {
            flex: 1;
            resize: none;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
            font-family: inherit;
            outline: none;
            max-height: 160px;
        }
        #input:focus { border-color: #2563eb; }
        button {
            padding: 0 20px; height: 40px;
            background: #2563eb; color: white;
            border: none; border-radius: 10px;
            cursor: pointer; font-size: 14px; font-weight: 500;
        }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        button.secondary { background: #f3f4f6; color: #374151; }
        .empty-hint {
            text-align: center; color: #9ca3af; margin-top: 80px; font-size: 14px;
        }
        .empty-hint h2 { color: #4b5563; font-weight: 500; }
    </style>
</head>
<body>
<header>
    <div>
        <span class="title">yu_ai · 流式聊天</span>
        <span class="subtitle">模块 1 · GET /m1/stream (SSE)</span>
    </div>
    <a href="/">← 返回模块导航</a>
</header>

<main>
    <div class="messages" id="messages">
        <div class="empty-hint">
            <h2>👋 试试问点什么</h2>
            <p>例：讲一个程序员的笑话 / 用 Java 写一个快速排序 / 解释一下 ReAct Agent</p>
        </div>
    </div>
</main>

<footer>
    <div class="input-wrap">
        <textarea id="input" rows="2" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <button id="send">发送</button>
        <button id="clear" class="secondary" title="清空对话">清空</button>
    </div>
</footer>

<script>
    const messagesEl = document.getElementById('messages');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const clearBtn = document.getElementById('clear');
    let currentEventSource = null;

    function clearEmptyHint() {
        const hint = messagesEl.querySelector('.empty-hint');
        if (hint) hint.remove();
    }

    function appendMessage(role, text = '') {
        clearEmptyHint();
        const wrap = document.createElement('div');
        wrap.className = 'msg ' + role;
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'user' ? '我' : 'AI';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        if (role === 'user') {
            bubble.textContent = text;
        }
        wrap.appendChild(avatar);
        wrap.appendChild(bubble);
        messagesEl.appendChild(wrap);
        scrollToBottom();
        return bubble;
    }

    function scrollToBottom() {
        const main = document.querySelector('main');
        main.scrollTop = main.scrollHeight;
    }

    function send() {
        const msg = input.value.trim();
        if (!msg) return;
        if (currentEventSource) {
            currentEventSource.close();
            currentEventSource = null;
        }

        input.value = '';
        sendBtn.disabled = true;
        appendMessage('user', msg);

        const aiBubble = appendMessage('ai');
        let buffer = '';

        const url = `/m1/stream?message=${encodeURIComponent(msg)}`;
        const es = new EventSource(url);
        currentEventSource = es;

        const renderCursor = () => {
            const c = document.createElement('span');
            c.className = 'cursor';
            aiBubble.appendChild(c);
        };

        // 初始光标
        renderCursor();

        es.onmessage = (e) => {
            // SSE 把每个 chunk 作为一条 data 事件，拼成完整文本再用 markdown 渲染
            buffer += e.data;
            aiBubble.innerHTML = marked.parse(buffer);
            renderCursor();
            scrollToBottom();
        };

        es.onerror = () => {
            // SSE 流结束（Spring 的 SSE 没有 close 帧，正常结束也走 onerror）
            es.close();
            currentEventSource = null;
            aiBubble.innerHTML = marked.parse(buffer || '_(无内容)_');
            sendBtn.disabled = false;
            input.focus();
        };
    }

    sendBtn.onclick = send;
    clearBtn.onclick = () => {
        if (currentEventSource) currentEventSource.close();
        messagesEl.innerHTML = '<div class="empty-hint"><h2>👋 试试问点什么</h2><p>例：讲一个程序员的笑话 / 用 Java 写一个快速排序 / 解释一下 ReAct Agent</p></div>';
        sendBtn.disabled = false;
    };
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            send();
        }
    });
    input.focus();
</script>
</body>
</html>
